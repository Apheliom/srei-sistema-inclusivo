<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Círculo exterior inclusivo -->
  <circle cx="100" cy="100" r="92" fill="#F8FAFC" stroke="url(#gradNavy)" stroke-width="4" stroke-dasharray="8 4" />
  
  <!-- Hojas / Manos de apoyo inferior -->
  <path d="M40 145 C60 175 140 175 160 145 C135 155 65 155 40 145 Z" fill="url(#gradGreen)" />
  
  <!-- Figura central: Niño alcanzando meta -->
  <!-- Cabeza -->
  <circle cx="100" cy="72" r="16" fill="url(#gradNavy)" />
  
  <!-- Torso y brazos extendidos hacia las estrellas -->
  <path d="M100 92 C82 92 68 106 62 120 C75 125 85 116 100 116 C115 116 125 125 138 120 C132 106 118 92 100 92 Z" fill="url(#gradNavy)" />
  <path d="M78 96 L50 68 C47 65 42 67 43 71 L56 98 Z" fill="url(#gradNavy)" />
  <path d="M122 96 L150 68 C153 65 158 67 157 71 L144 98 Z" fill="url(#gradNavy)" />

  <!-- Estrella dorada brillante arriba -->
  <polygon points="100,32 104,42 115,43 107,50 110,60 100,54 90,60 93,50 85,43 96,42" fill="#F59E0B" />
  
  <!-- Letras SREI -->
  <text x="100" y="172" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="3">SREI</text>
</svg>

